name: Build AimLock V2 Premium

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Create Android project
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/java/com/aimlock/v2
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "AimLock-V2-Premium-Kk"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=false
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.aimlock.v2'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.aimlock.v2'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '2.0'
              }
          }
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">AimLock V2 Premium</string>
          </resources>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme"
                  parent="@android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#050505</item>
                  <item name="android:navigationBarColor">#050505</item>
                  <item name="android:colorAccent">#20D66B</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:theme="@style/AppTheme"
                  android:label="AimLock V2 Premium"
                  android:allowBackup="false"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > app/src/main/java/com/aimlock/v2/MainActivity.java <<'EOF'
          package com.aimlock.v2;

          import android.app.Activity;
          import android.os.Bundle;
          import android.os.Handler;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.*;

          public class MainActivity extends Activity {

              private final int GREEN = Color.rgb(30, 220, 105);
              private final int GRAY = Color.rgb(80, 80, 84);
              private final int RED = Color.rgb(235, 35, 45);
              private final int DARK = Color.rgb(8, 8, 10);

              private LinearLayout root;
              private TextView status;

              private int dp(int v) {
                  return (int)(v * getResources()
                      .getDisplayMetrics().density + 0.5f);
              }

              private GradientDrawable box(int color, int radius) {
                  GradientDrawable g = new GradientDrawable();
                  g.setColor(color);
                  g.setCornerRadius(dp(radius));
                  return g;
              }

              private TextView label(String value, float size) {
                  TextView t = new TextView(this);
                  t.setText(value);
                  t.setTextColor(Color.WHITE);
                  t.setTextSize(size);
                  return t;
              }

              @Override
              protected void onCreate(Bundle state) {
                  super.onCreate(state);
                  showLogin();
              }

              private void showLogin() {
                  LinearLayout page = new LinearLayout(this);
                  page.setOrientation(LinearLayout.VERTICAL);
                  page.setGravity(Gravity.CENTER);
                  page.setPadding(dp(28), dp(25), dp(28), dp(25));
                  page.setBackgroundColor(DARK);

                  TextView title = label("AimLock V2 Premium", 28);
                  title.setTypeface(Typeface.DEFAULT, Typeface.BOLD);
                  title.setGravity(Gravity.CENTER);
                  page.addView(title,
                      new LinearLayout.LayoutParams(-1, dp(70)));

                  TextView sub = label("PREMIUM ACCESS", 12);
                  sub.setGravity(Gravity.CENTER);
                  page.addView(sub);

                  EditText account = new EditText(this);
                  account.setHint("Tài khoản");
                  account.setTextColor(Color.WHITE);
                  account.setHintTextColor(Color.GRAY);
                  account.setSingleLine(true);
                  account.setPadding(dp(18), 0, dp(18), 0);
                  account.setBackground(box(
                      Color.rgb(30,30,32), 18));

                  LinearLayout.LayoutParams p1 =
                      new LinearLayout.LayoutParams(-1, dp(55));
                  p1.setMargins(0, dp(25), 0, dp(12));
                  page.addView(account, p1);

                  EditText password = new EditText(this);
                  password.setHint("Mật khẩu");
                  password.setTextColor(Color.WHITE);
                  password.setHintTextColor(Color.GRAY);
                  password.setSingleLine(true);
                  password.setInputType(0x81);
                  password.setPadding(dp(18), 0, dp(18), 0);
                  password.setBackground(box(
                      Color.rgb(30,30,32), 18));

                  page.addView(password,
                      new LinearLayout.LayoutParams(-1, dp(55)));

                  Button login = new Button(this);
                  login.setText("ĐĂNG NHẬP");
                  login.setTextColor(Color.WHITE);
                  login.setBackground(box(RED, 18));

                  LinearLayout.LayoutParams p2 =
                      new LinearLayout.LayoutParams(-1, dp(55));
                  p2.setMargins(0, dp(20), 0, 0);
                  page.addView(login, p2);

                  login.setOnClickListener(v -> {
                      String user = account.getText().toString();
                      String pass = password.getText().toString();

                      if (user.equals("Ob55")
                              && pass.equals("OB55XINCHAO")) {
                          showMenu();
                      } else {
                          Toast.makeText(
                              this,
                              "Sai tài khoản hoặc mật khẩu",
                              Toast.LENGTH_SHORT
                          ).show();
                      }
                  });

                  setContentView(page);
              }

              private void showMenu() {
                  root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(dp(20), dp(15), dp(20), dp(20));
                  root.setBackgroundColor(DARK);

                  TextView title = label("AIMLOCK V2 PREMIUM", 25);
                  title.setTypeface(Typeface.DEFAULT, Typeface.BOLD);
                  title.setGravity(Gravity.CENTER);

                  root.addView(title,
                      new LinearLayout.LayoutParams(-1, dp(65)));

                  TextView sub = label("MENU", 11);
                  sub.setGravity(Gravity.CENTER);
                  root.addView(sub);

                  Space sp = new Space(this);
                  root.addView(sp,
                      new LinearLayout.LayoutParams(1, dp(15)));

                  addSwitch("🎯  REG FILES");
                  addSwitch("🚀  BOST RAM");
                  addSwitch("💀  HEADLOCK");
                  addSwitch("⚙️  FIX RUNG");

                  status = label("Sẵn sàng", 16);
                  status.setGravity(Gravity.CENTER);

                  LinearLayout.LayoutParams st =
                      new LinearLayout.LayoutParams(-1, dp(65));
                  st.setMargins(0, dp(15), 0, 0);

                  root.addView(status, st);

                  setContentView(root);
              }

              private void addSwitch(String name) {
                  LinearLayout row = new LinearLayout(this);
                  row.setGravity(Gravity.CENTER_VERTICAL);
                  row.setPadding(dp(15), 0, dp(8), 0);
                  row.setBackground(box(
                      Color.rgb(25,25,27), 18));

                  LinearLayout.LayoutParams rp =
                      new LinearLayout.LayoutParams(-1, dp(65));
                  rp.setMargins(0, 0, 0, dp(10));

                  TextView title = label(name, 16);
                  title.setLayoutParams(
                      new LinearLayout.LayoutParams(
                          0, -1, 1));

                  title.setGravity(Gravity.CENTER_VERTICAL);

                  Switch sw = new Switch(this);
                  sw.setText("");
                  sw.setChecked(false);
                  sw.setTrackTintList(
                      new android.content.res.ColorStateList(
                          new int[][] {
                              new int[] { android.R.attr.state_checked },
                              new int[] {}
                          },
                          new int[] { GREEN, GRAY }
                      )
                  );

                  sw.setOnCheckedChangeListener((button, checked) -> {
                      String clean = name.substring(4);

                      if (checked) {
                          status.setText("Đã bật " + clean);
                          status.setTextColor(GREEN);

                          if (name.contains("BOST RAM")) {
                              showBoost();
                          }
                      } else {
                          status.setText("Đã tắt " + clean);
                          status.setTextColor(Color.WHITE);
                      }
                  });

                  row.addView(title);
                  row.addView(sw);
                  root.addView(row, rp);
              }

              private void showBoost() {
                  final TextView boost = label("FPS", 12);
                  boost.setGravity(Gravity.CENTER);
                  boost.setTypeface(Typeface.DEFAULT, Typeface.BOLD);
                  boost.setTextColor(Color.WHITE);
                  boost.setBackground(box(GREEN, 8));

                  addContentView(
                      boost,
                      new ViewGroup.LayoutParams(dp(55), dp(55))
                  );

                  boost.post(() -> {
                      boost.setX(dp(12));
                      boost.setY(dp(120));
                  });

                  new Handler().postDelayed(
                      () -> ((ViewGroup) boost.getParent())
                          .removeView(boost),
                      3000
                  );
              }
          }
          EOF

      - name: Verify Gradle project
        run: |
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/aimlock/v2/MainActivity.java
          echo "Project OK"

      - name: Build Debug APK
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Find APK
        run: |
          find app/build/outputs -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AimLock-V2-Premium-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
